<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<title>Démo Nova Calendar</title>
		<script type="module" src="/src/index.js"></script>
	</head>
	<body>
		<input type="text" id="datepicker" placeholder="Choisissez une date" />

		<script type="module">
			const calendar = new NovaCalendar();
			calendar.attachTo('#datepicker');

			// Exemple de blocage de dates :
			calendar.setBlockedDates(['2025-07-04', '2025-07-10', '2025-06-10']);

			// Exemple de présélection d'une plage
			calendar.setRange('2025-05-22', '2025-06-05');

			// Écouter la sélection de plage
			document
				.querySelector('#datepicker')
				.addEventListener('rangeSelected', (e) => {
					console.log('Sélection:', e.detail.start, e.detail.end);
				});
		</script>
	</body>
</html>
